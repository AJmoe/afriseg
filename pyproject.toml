[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afriseg"
version = "0.1.0"
description = "Acquisition-physics augmentation to close the BraTS 2021 -> BraTS-Africa glioma segmentation gap"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "pandas", "nibabel", "matplotlib", "torch", "monai>=1.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
